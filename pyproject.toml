[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-cardian"
version = "0.1.0"
description = "AI-Based ECG Signal Analysis for Automated Cardiac Abnormality Detection and Classification"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Academic Research Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.0,<2.3.0",
    "pandas>=2.1.0,<3.0.0",
    "scipy>=1.11.0,<1.15.0",
    "PyWavelets>=1.5.0,<1.8.0",
    "scikit-learn>=1.4.0,<1.7.0",
    "wfdb>=4.1.2,<4.3.0",
    "torch>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "tqdm>=4.66.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyflakes>=3.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "src",
]
